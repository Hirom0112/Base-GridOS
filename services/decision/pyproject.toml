[project]
name = "gridos-decision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.75.0",
  "grpcio-tools>=1.75.0",
  "highspy>=1.11.0",
  "opentelemetry-api>=1.45.0",
  "opentelemetry-sdk>=1.45.0",
  "prometheus-client>=0.22.0",
  "protobuf>=6.32.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gridos*"]
exclude = ["gridos.gen*"]

[dependency-groups]
dev = [
  "hypothesis>=6.138.0",
  "mypy>=1.18.0",
  "pytest>=8.4.0",
  "ruff>=0.13.0",
  "types-grpcio>=1.0.0",
  "types-protobuf>=6.30.0",
]

[tool.mypy]
strict = true
exclude = ["gridos/gen"]
mypy_path = ["gridos/gen"]

[[tool.mypy.overrides]]
module = ["gridos.v1.*"]
follow_imports = "silent"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
pythonpath = ["."]
