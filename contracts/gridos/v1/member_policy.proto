syntax = "proto3";

package gridos.v1;

option go_package = "github.com/Hirom0112/Base-GridOS/contracts/gen/go/gridos/v1;gridosv1";

import "google/protobuf/timestamp.proto";

enum TravelFlexCreditType {
  TRAVEL_FLEX_CREDIT_TYPE_UNSPECIFIED = 0;
  TRAVEL_FLEX_CREDIT_TYPE_FIXED_DAILY = 1;
  TRAVEL_FLEX_CREDIT_TYPE_FIXED_EVENT = 2;
  TRAVEL_FLEX_CREDIT_TYPE_FIXED_ANNUAL = 3;
}

enum EarlyReturnAction {
  EARLY_RETURN_ACTION_UNSPECIFIED = 0;
  EARLY_RETURN_ACTION_RESTORE_PLAN_RESERVE = 1;
  EARLY_RETURN_ACTION_RESTORE_MAXIMUM_RESERVE = 2;
}

enum ReserveOverrideReason {
  RESERVE_OVERRIDE_REASON_UNSPECIFIED = 0;
  RESERVE_OVERRIDE_REASON_WEATHER = 1;
  RESERVE_OVERRIDE_REASON_OUTAGE_RISK = 2;
  RESERVE_OVERRIDE_REASON_HEALTH = 3;
  RESERVE_OVERRIDE_REASON_STALE_TELEMETRY = 4;
  RESERVE_OVERRIDE_REASON_ALARM = 5;
  RESERVE_OVERRIDE_REASON_EARLY_RETURN = 6;
  RESERVE_OVERRIDE_REASON_COMMUNICATIONS = 7;
}

message ResiliencePlan {
  string resilience_plan_id = 1;
  string member_id = 2;
  string market = 3;
  double reserve_floor_percent = 4;
  string consent_text = 5;
  string consent_version = 6;
  string policy_version = 7;
  google.protobuf.Timestamp effective_at = 8;
  google.protobuf.Timestamp expires_at = 9;
}

message TravelFlexWindow {
  string travel_flex_window_id = 1;
  string member_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  string timezone = 5;
  double temporary_reserve_percent = 6;
  EarlyReturnAction early_return_action = 7;
  TravelFlexCreditType credit_type = 8;
  int64 credit_cents = 9;
  string consent_text = 10;
  string consent_version = 11;
  string policy_version = 12;
}

message ReserveOverride {
  string reserve_override_id = 1;
  string member_id = 2;
  ReserveOverrideReason reason = 3;
  double reserve_floor_percent = 4;
  google.protobuf.Timestamp effective_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  string policy_version = 7;
}
