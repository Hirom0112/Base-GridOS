syntax = "proto3";

package gridos.v1;

option go_package = "github.com/Hirom0112/Base-GridOS/contracts/gen/go/gridos/v1;gridosv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "gridos/v1/device.proto";
import "gridos/v1/dispatch.proto";
import "gridos/v1/telemetry.proto";

message OptimizationInterval {
  google.protobuf.Timestamp begin_time = 1;
  google.protobuf.Timestamp end_time = 2;
  double target_kw = 3;
}

message DeviceState {
  string device_id = 1;
  double usable_energy_kwh = 2;
  double energy_kwh = 3;
  double hardware_floor_kwh = 4;
  double effective_reserve_kwh = 5;
  double max_charge_kw = 6;
  double max_discharge_kw = 7;
  double charge_efficiency = 8;
  double discharge_efficiency = 9;
  double availability_probability = 10;
  bool stale = 11;
  google.protobuf.Timestamp telemetry_observed_at = 12;
  string load_zone = 13;
  string site_id = 14;
  string reliability_trait = 15;
  optional double base_reserve_kwh = 16;
  optional double travel_flex_reserve_kwh = 17;
}

message ForecastSite {
  string site_id = 1;
  string load_profile_type = 2;
  string load_zone = 3;
  string weather_zone = 4;
  string county = 5;
}

message ForecastValue {
  double value = 1;
  double lower = 2;
  double upper = 3;
  string feature_version = 4;
  string model_version = 5;
  string value_kind = 6;
  DataProvenance provenance = 7;
  google.protobuf.Timestamp training_window_begin = 8;
  google.protobuf.Timestamp training_window_end = 9;
  google.protobuf.Timestamp issued_at = 10;
  google.protobuf.Duration horizon = 11;
  optional double interval_coverage = 12;
}

message ForecastSiteLoad {
  string site_id = 1;
  google.protobuf.Timestamp interval_begin_time = 2;
  ForecastValue load_kwh = 3;
}

message ForecastRegionalPrice {
  string load_zone = 1;
  google.protobuf.Timestamp interval_begin_time = 2;
  ForecastValue price_per_mwh = 3;
}

message ForecastOutageRisk {
  string county = 1;
  google.protobuf.Timestamp interval_begin_time = 2;
  ForecastValue probability = 3;
}

message ForecastDeviceAvailability {
  string device_id = 1;
  google.protobuf.Timestamp interval_begin_time = 2;
  ForecastValue probability = 3;
}

message ForecastRequest {
  OptimizationRequest request = 1;
}

message ForecastResponse {
  repeated ForecastSiteLoad site_loads = 1;
  repeated ForecastRegionalPrice regional_prices = 2;
  repeated ForecastOutageRisk outage_risks = 3;
  repeated ForecastDeviceAvailability device_availability = 4;
  repeated string unavailable_sources = 5;
}

message OptimizationRequest {
  string request_id = 1;
  string event_id = 2;
  uint64 plan_version = 3;
  EligibilitySnapshot eligibility_snapshot = 4;
  ReservePolicy reserve_policy = 5;
  repeated OptimizationInterval intervals = 6;
  google.protobuf.Timestamp requested_at = 7;
  string correlation_id = 8;
  google.protobuf.Duration budget = 9;
  MeasurementBoundary measurement_boundary = 10;
  repeated DeviceState devices = 11;
  repeated ForecastSite sites = 12;
  ForecastResponse forecast = 13;
  double conservative_margin = 14;
  double margin_hurdle = 15;
}

message ObjectiveBreakdown {
  double grid_value = 1;
  double commitment_tracking_value = 2;
  double charging_energy_cost = 3;
  double degradation_cost = 4;
  double penalty_exposure = 5;
  double reliability_risk_cost = 6;
  double objective_value = 7;
}

message MarginTerm {
  string name = 1;
  double low = 2;
  double high = 3;
  string source = 4;
  bool unavailable = 5;
}

message MarginExplanation {
  double conservative_margin = 1;
  double margin_hurdle = 2;
  repeated MarginTerm terms = 3;
}

message ConstraintMargin {
  string constraint_name = 1;
  double margin = 2;
  string units = 3;
  google.protobuf.Timestamp interval_begin_time = 4;
}

message DeviceScheduleInterval {
  google.protobuf.Timestamp begin_time = 1;
  google.protobuf.Timestamp end_time = 2;
  double setpoint_kw = 3;
  double expected_energy_kwh = 4;
  double expected_state_of_energy_percent = 5;
}

enum ReserveSelection {
  RESERVE_SELECTION_UNSPECIFIED = 0;
  RESERVE_SELECTION_BASE = 1;
  RESERVE_SELECTION_TRAVEL_FLEX = 2;
}

message DeviceSchedule {
  string device_id = 1;
  repeated DeviceScheduleInterval intervals = 2;
  ReserveSelection reserve_selection = 3;
  double selected_reserve_kwh = 4;
}

message ShortfallReport {
  google.protobuf.Timestamp interval_begin_time = 1;
  google.protobuf.Timestamp interval_end_time = 2;
  double requested_kw = 3;
  double feasible_kw = 4;
  double shortfall_kw = 5;
  repeated string reasons = 6;
}

message DispatchPlan {
  string plan_id = 1;
  string event_id = 2;
  uint64 plan_version = 3;
  ObjectiveBreakdown objective_breakdown = 4;
  repeated ConstraintMargin constraint_margins = 5;
  repeated DeviceExclusion exclusions = 6;
  repeated DeviceSchedule device_schedules = 7;
  repeated ShortfallReport shortfalls = 8;
  bool fallback_used = 9;
  string solver_version = 10;
  string model_version = 11;
  google.protobuf.Timestamp created_at = 12;
  string fallback_reason = 13;
  MarginExplanation margin_explanation = 14;
}

message PlanExplanationEvidence {
  repeated ForecastSiteLoad site_loads = 1;
  string site_load_units = 2;
  bool fallback_used = 3;
  string fallback_reason = 4;
  repeated DeviceSchedule device_schedules = 5;
  repeated ForecastRegionalPrice regional_prices = 6;
  repeated ForecastOutageRisk outage_risks = 7;
  repeated ForecastDeviceAvailability device_availability = 8;
  repeated string unavailable_sources = 9;
  repeated FrozenReserveBasis reserve_bases = 10;
  repeated FrozenTravelFlexBinding travel_flex_bindings = 11;
}

message OptimizeRequest {
  OptimizationRequest request = 1;
}

message OptimizeResponse {
  DispatchPlan plan = 1;
}

message ReplaceRequest {
  OptimizationRequest current = 1;
  DispatchPlan approved_plan = 2;
  repeated string dropped_device_ids = 3;
  repeated string envelope_device_ids = 4;
  string idempotency_key = 5;
}

message ReplaceResponse {
  DispatchPlan replacement_plan = 1;
}

service OptimizationService {
  rpc Forecast(ForecastRequest) returns (ForecastResponse);
  rpc Optimize(OptimizeRequest) returns (OptimizeResponse);
  rpc Replace(ReplaceRequest) returns (ReplaceResponse);
}
