syntax = "proto3";

package gridos.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "gridos/v1/device.proto";
import "gridos/v1/dispatch.proto";
import "gridos/v1/events.proto";
import "gridos/v1/optimization.proto";
import "gridos/v1/telemetry.proto";
import "gridos/v1/verification.proto";
option go_package = "github.com/Hirom0112/Base-GridOS/contracts/gen/go/gridos/v1;gridosv1";

enum FleetOperatingState {
  FLEET_OPERATING_STATE_UNSPECIFIED = 0;
  FLEET_OPERATING_STATE_ON_GRID = 1;
  FLEET_OPERATING_STATE_OFF_GRID_OUTAGE = 2;
  FLEET_OPERATING_STATE_OFF_GRID_NO_HOME_POWER = 3;
  FLEET_OPERATING_STATE_OFF_GRID_OVERCURRENT = 4;
  FLEET_OPERATING_STATE_OFF_GRID_OVERCURRENT_STANDBY = 5;
  FLEET_OPERATING_STATE_TELEMETRY_UNAVAILABLE = 6;
}

enum FleetAvailabilityState {
  FLEET_AVAILABILITY_STATE_UNSPECIFIED = 0;
  FLEET_AVAILABILITY_STATE_ONLINE = 1;
  FLEET_AVAILABILITY_STATE_OFFLINE = 2;
  FLEET_AVAILABILITY_STATE_DEGRADED = 3;
  FLEET_AVAILABILITY_STATE_STALE = 4;
  FLEET_AVAILABILITY_STATE_MAINTENANCE = 5;
}

enum FleetHealthState {
  FLEET_HEALTH_STATE_UNSPECIFIED = 0;
  FLEET_HEALTH_STATE_HEALTHY = 1;
  FLEET_HEALTH_STATE_DEGRADED = 2;
  FLEET_HEALTH_STATE_UNHEALTHY = 3;
  FLEET_HEALTH_STATE_UNKNOWN = 4;
}

message ProvenanceShare {
  DataProvenance provenance = 1;
  uint64 record_count = 2;
}

message AggregateMetadata {
  google.protobuf.Timestamp timestamp = 1;
  repeated ProvenanceShare provenance_mix = 2;
  google.protobuf.Duration freshness = 3;
}

message FleetQuantityAggregate {
  double value = 1;
  AggregateMetadata metadata = 2;
}

message FleetDeviceCountAggregate {
  uint64 device_count = 1;
  AggregateMetadata metadata = 2;
}

message OperatingStateDeviceCount {
  FleetOperatingState operating_state = 1;
  FleetDeviceCountAggregate aggregate = 2;
}

message AvailabilityStateDeviceCount {
  FleetAvailabilityState availability_state = 1;
  FleetDeviceCountAggregate aggregate = 2;
}

message HealthStateDeviceCount {
  FleetHealthState health_state = 1;
  FleetDeviceCountAggregate aggregate = 2;
}

message FleetSummary {
  FleetQuantityAggregate installed_mw = 1;
  FleetQuantityAggregate installed_mwh = 2;
  FleetQuantityAggregate dispatchable_now_mw = 3;
  FleetQuantityAggregate forecast_dispatchable_mw = 4;
  FleetQuantityAggregate reserved_for_backup_mwh = 5;
  repeated OperatingStateDeviceCount operating_state_counts = 6;
  repeated AvailabilityStateDeviceCount availability_state_counts = 7;
  repeated HealthStateDeviceCount communications_health_counts = 8;
  repeated HealthStateDeviceCount acknowledgement_health_counts = 9;
}

message GetFleetSummaryRequest {
  repeated string load_zones = 1;
}

message GetFleetSummaryResponse {
  FleetSummary summary = 1;
}

message H3SiteAggregate {
  string h3_cell = 1;
  uint64 site_count = 2;
  FleetQuantityAggregate installed_mw = 3;
  FleetQuantityAggregate installed_mwh = 4;
  FleetQuantityAggregate dispatchable_mw = 5;
  FleetQuantityAggregate reserved_mwh = 6;
  repeated OperatingStateDeviceCount operating_state_counts = 7;
  AggregateMetadata metadata = 8;
  repeated AvailabilityStateDeviceCount availability_state_counts = 9;
}

message AuthorizedSite {
  Site site = 1;
  repeated Device devices = 2;
}

message SiteLocation {
  oneof location {
    H3SiteAggregate aggregate = 1;
    AuthorizedSite exact = 2;
  }
}

message ListSitesRequest {
  repeated string load_zones = 1;
  bool request_exact_h3_cells = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ListSitesResponse {
  repeated SiteLocation sites = 1;
  string next_page_token = 2;
}

message CreateEventRequestRequest {
  EventRequest event_request = 1;
  string idempotency_key = 2;
}

message CreateEventRequestResponse {
  DispatchEvent event = 1;
}

message GetEventRequest {
  string event_id = 1;
}

message GetEventResponse {
  DispatchEvent event = 1;
  repeated ExclusionReasonGroup exclusions = 2;
  BasicEventReport report = 3;
  repeated SafetyViolation safety_violations = 4;
}

message GetPlanExplanationRequest {
  string event_id = 1;
  uint64 plan_version = 2;
}
message GetPlanExplanationResponse {
  ObjectiveBreakdown objective_breakdown = 1;
  double reserve_held_back_kwh = 2;
  repeated ConstraintMargin constraint_margins = 3;
  repeated DeviceExclusion exclusions = 4;
  repeated ShortfallReport shortfalls = 5;
  MarginExplanation margin_explanation = 6;
  PlanExplanationEvidence evidence = 7;
}

message ValidateUnsafeAlternativeRequest {
  string event_id = 1;
  uint64 plan_version = 2;
  DispatchPlan alternative_plan = 3;
}

message ValidateUnsafeAlternativeResponse {
  bool approved = 1;
  repeated SafetyViolation violations = 2;
  string operator_explanation = 3;
}

message SafetyViolation {
  string code = 1;
}

message ExclusionReasonGroup {
  ExclusionReason reason = 1;
  uint64 count = 2;
}

message BasicEventReport {
  double requested_mw = 1;
  double approved_mw = 2;
  double commanded_mw = 3;
  double acknowledged_mw = 4;
  repeated ExclusionReasonGroup exclusions = 5;
  repeated string provenance = 6;
  string policy_version = 7;
  string solver_version = 8;
  string model_version = 9;
  double delivered_mw = 10;
  double delivered_mwh = 11;
  double tracking_error_mw = 12;
  google.protobuf.Duration response_latency = 13;
  double completeness = 14;
  uint64 responded_devices = 15;
  uint64 commanded_devices = 16;
  repeated UncertainDeliveryInterval uncertain_intervals = 17;
}

message UncertainDeliveryInterval {
  string device_id = 1;
  google.protobuf.Timestamp begin_time = 2;
  google.protobuf.Timestamp end_time = 3;
  double lower_kw = 4;
  double upper_kw = 5;
}

message ApproveEventRequest {
  string event_id = 1;
  uint64 plan_version = 2;
  string idempotency_key = 3;
  string approved_by = 4;
  google.protobuf.Timestamp approved_at = 5;
}

message ApproveEventResponse {
  DispatchEvent event = 1;
}

message LaunchEventRequest {
  string event_id = 1;
  uint64 plan_version = 2;
  string idempotency_key = 3;
  string requested_by = 4;
  google.protobuf.Timestamp requested_at = 5;
}

message LaunchEventResponse {
  DispatchEvent event = 1;
}

message PublishTelemetryRequest {
  string gateway_id = 1;
  repeated TelemetryObservation observations = 2;
}

message PublishTelemetryResponse {
  string durable_receipt_id = 1;
  repeated string observation_ids = 2;
  google.protobuf.Timestamp durably_received_at = 3;
}

message EventTimelineEntry {
  uint64 sequence = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string actor_id = 3;
  string action = 4;
  DispatchEventState previous_state = 5;
  DispatchEventState state = 6;
  string reason = 7;
}

message GetEventTimelineRequest {
  string event_id = 1;
}
message GetEventTimelineResponse {
  repeated EventTimelineEntry entries = 1;
  repeated EventException exceptions = 2;
}

message EmergencyStopRequest {
  string event_id = 1;
  string idempotency_key = 2;
  string requested_by = 3;
  string reason = 4;
  google.protobuf.Timestamp requested_at = 5;
  string correlation_id = 6;
}

message EmergencyStopResponse {
  EmergencyStop emergency_stop = 1;
  bool stop_requested = 2;
}

message EventPowerAggregate {
  double sent_mw = 1;
  double acknowledged_mw = 2;
  double delivered_mw = 3;
  repeated UncertaintyInterval uncertainty_intervals = 4;
  AggregateMetadata metadata = 5;
  ValueState delivered_state = 6;
}

message H3EventPowerAggregate {
  string h3_cell = 1;
  EventPowerAggregate power = 2;
  AggregateMetadata metadata = 3;
}

message WatchEventResponse {
  DispatchEvent event = 1;
  EventPowerAggregate fleet = 2;
  repeated H3EventPowerAggregate h3 = 3;
  google.protobuf.Timestamp observed_at = 4;
  repeated EventException exceptions = 5;
}

message WatchEventRequest {
  string event_id = 1;
}

message ReplayEventRequest {
  string event_id = 1;
}

message ReplayDifference {
  string field = 1;
  string expected_json = 2;
  string actual_json = 3;
}

message ReplayEventResponse {
  int64 seed = 1;
  string input_snapshot_id = 2;
  string eligibility_snapshot_id = 3;
  string policy_version = 4;
  string solver_version = 5;
  string fallback_version = 6;
  string code_version = 7;
  string fleet_sha256 = 8;
  string scenario_sha256 = 9;
  repeated EventTimelineEntry updates = 10;
  string diff_status = 11;
  repeated ReplayDifference differences = 12;
}

message GetEventReportRequest {
  string event_id = 1;
  bool partner_view = 2;
}

message GetEventReportResponse {
  string report_json = 1;
}

message CompareEventReportsRequest {
  string event_id_a = 1;
  string event_id_b = 2;
  optional uint64 plan_version_a = 3;
  optional uint64 plan_version_b = 4;
}

message EventReportDifference {
  string field = 1;
  string before = 2;
  string after = 3;
}

message CompareEventReportsResponse {
  repeated EventReportDifference differences = 1;
}

message ContextSource {
  DataProvenance provenance = 1;
  google.protobuf.Timestamp as_of = 2;
  google.protobuf.Duration freshness = 3;
}

message ContextMarketPrice {
  google.protobuf.Timestamp interval_end = 1;
  string settlement_point = 2;
  double usd_per_mwh = 3;
  ContextSource source = 4;
}

message ContextSystemLoad {
  google.protobuf.Timestamp interval_end = 1;
  string weather_zone = 2;
  double mw = 3;
  ContextSource source = 4;
}

message ContextWeatherForecast {
  string city = 1;
  google.protobuf.Timestamp begin_time = 2;
  google.protobuf.Timestamp end_time = 3;
  int32 temperature_f = 4;
  string summary = 5;
  ContextSource source = 6;
}

message ContextWeatherAlert {
  string city = 1;
  string event = 2;
  string severity = 3;
  google.protobuf.Timestamp effective_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  ContextSource source = 6;
}

message ContextOutageRate {
  string county = 1;
  string month = 2;
  double rate = 3;
  ContextSource source = 4;
}

message ContextWindowCandidate {
  google.protobuf.Timestamp begin_time = 1;
  google.protobuf.Timestamp end_time = 2;
  double price_usd_per_mwh = 3;
  double regional_load_mw = 4;
  double outage_risk = 5;
  double feasible_capacity_mw = 6;
}

message ContextDispatchWindow {
  google.protobuf.Timestamp begin_time = 1;
  google.protobuf.Timestamp end_time = 2;
  uint32 rank = 3;
  double score = 4;
  double forecast_grid_value_usd = 5;
  string value_kind = 6;
}

message GetMarketContextRequest {
  string settlement_point = 1;
  string weather_zone = 2;
}

message GetMarketContextResponse {
  repeated ContextMarketPrice day_ahead_prices = 1;
  repeated ContextMarketPrice real_time_prices = 2;
  repeated ContextSystemLoad system_loads = 3;
}

message GetWeatherContextRequest {
  string city = 1;
}

message GetWeatherContextResponse {
  repeated ContextWeatherForecast forecasts = 1;
  repeated ContextWeatherAlert alerts = 2;
}

message GetOutageRiskRequest {
  string county = 1;
}

message GetOutageRiskResponse {
  repeated ContextOutageRate rates = 1;
}

message ListDispatchWindowsRequest {
  repeated ContextWindowCandidate candidates = 1;
}

message ListDispatchWindowsResponse {
  repeated ContextDispatchWindow windows = 1;
}

service FleetService {
  rpc GetFleetSummary(GetFleetSummaryRequest) returns (GetFleetSummaryResponse);
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
}

service DispatchService {
  rpc CreateEventRequest(CreateEventRequestRequest) returns (CreateEventRequestResponse);
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  rpc GetPlanExplanation(GetPlanExplanationRequest) returns (GetPlanExplanationResponse);
  rpc ValidateUnsafeAlternative(ValidateUnsafeAlternativeRequest) returns (ValidateUnsafeAlternativeResponse);
  rpc ApproveEvent(ApproveEventRequest) returns (ApproveEventResponse);
  rpc LaunchEvent(LaunchEventRequest) returns (LaunchEventResponse);
}

service TelemetryService {
  rpc PublishTelemetry(PublishTelemetryRequest) returns (PublishTelemetryResponse);
}

service EventsService {
  rpc GetEventTimeline(GetEventTimelineRequest) returns (GetEventTimelineResponse);
  rpc ListEventCommands(ListEventCommandsRequest) returns (ListEventCommandsResponse);
  rpc EmergencyStop(EmergencyStopRequest) returns (EmergencyStopResponse);
  rpc WatchEvent(WatchEventRequest) returns (stream WatchEventResponse);
}

service ReplayService {
  rpc ReplayEvent(ReplayEventRequest) returns (ReplayEventResponse);
}

service ReportService {
  rpc GetEventReport(GetEventReportRequest) returns (GetEventReportResponse);
  rpc CompareEventReports(CompareEventReportsRequest) returns (CompareEventReportsResponse);
}

service ContextService {
  rpc GetMarketContext(GetMarketContextRequest) returns (GetMarketContextResponse);
  rpc GetWeatherContext(GetWeatherContextRequest) returns (GetWeatherContextResponse);
  rpc GetOutageRisk(GetOutageRiskRequest) returns (GetOutageRiskResponse);
  rpc ListDispatchWindows(ListDispatchWindowsRequest) returns (ListDispatchWindowsResponse);
}
