syntax = "proto3";

package gridos.v1;

import "google/protobuf/timestamp.proto";
import "gridos/v1/dispatch.proto";

option go_package = "github.com/Hirom0112/Base-GridOS/contracts/gen/go/gridos/v1;gridosv1";

enum EventExceptionKind {
  EVENT_EXCEPTION_KIND_UNSPECIFIED = 0;
  EVENT_EXCEPTION_KIND_MISSING_TELEMETRY = 1;
  EVENT_EXCEPTION_KIND_UNCERTAIN_COMMAND = 2;
  EVENT_EXCEPTION_KIND_LATE_ACCEPTANCE = 3;
  EVENT_EXCEPTION_KIND_COMMAND_RETRY = 4;
  EVENT_EXCEPTION_KIND_REPLACEMENT_PLANNED = 5;
  EVENT_EXCEPTION_KIND_REPLACEMENT_SAFETY_REJECTED = 6;
  EVENT_EXCEPTION_KIND_EMERGENCY_STOP_REQUESTED = 7;
  EVENT_EXCEPTION_KIND_STALE_CAPACITY_REMOVED = 8;
  EVENT_EXCEPTION_KIND_REBALANCED_COMMAND = 9;
  EVENT_EXCEPTION_KIND_REJECTED_COMMAND = 10;
}

message EventException {
  EventExceptionKind kind = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string event_id = 3;
  string device_id = 4;
  string command_id = 5;
  string evidence_id = 6;
  string detail = 7;
}

message ListEventCommandsRequest {
  string event_id = 1;
}

message EventCommand {
  CommandIntent intent = 1;
  string state = 2;
  google.protobuf.Timestamp state_recorded_at = 3;
  CommandAcknowledgement receipt = 4;
}

message EventIntervalVerification {
  google.protobuf.Timestamp begin_time = 1;
  google.protobuf.Timestamp end_time = 2;
  double requested_kw = 3;
  double commanded_kw = 4;
  double delivered_kw = 5;
  double tracking_error_kw = 6;
  double confidence = 7;
  string baseline_method = 8;
  string measurement_boundary = 9;
  string value_kind = 10;
}

message ListEventCommandsResponse {
  repeated EventCommand commands = 1;
  repeated EventIntervalVerification verification_intervals = 2;
}
