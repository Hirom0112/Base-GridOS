services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gridos
      POSTGRES_PASSWORD: gridos
      POSTGRES_USER: gridos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridos -d gridos"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_PWD: gridos
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: gridos
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "7233:7233"

volumes:
  postgres-data:
