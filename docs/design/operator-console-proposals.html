<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GridOS visual proposals</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        background: #050907;
        color: #f0f7f2;
        font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        margin-bottom: 12px;
        font-size: 16px;
        font-weight: 600;
      }

      p {
        color: #b9c9bf;
      }

      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      section {
        min-width: 0;
        padding: 14px;
        background: #09120e;
        border: 1px solid #16271f;
        border-radius: 16px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #16271f;
        border-radius: 10px;
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GridOS operator console</h1>
      <p>Two layers of one product</p>
    </header>
    <main>
      <section>
        <h2>Proposal A · Evidence-first control room</h2>
        <img src="assets/operator-console-static.png" alt="Evidence-first GridOS control room">
      </section>
      <section>
        <h2>Proposal B · Cinematic Living Grid</h2>
        <img src="assets/operator-console-cinematic.png" alt="Cinematic Living Grid storyboard">
      </section>
    </main>
  </body>
</html>
